<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="topLoopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080FF"/>
      <stop offset="50%" stop-color="#00B2FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="bottomLoopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00D5BE"/>
      <stop offset="100%" stop-color="#00B8A9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Top Ring -->
  <path fill="none" stroke="url(#topLoopGrad)" stroke-width="48" stroke-linecap="round" d="M 256,210 C 190,210 140,165 140,115 C 140,65 190,25 256,25 C 322,25 372,65 372,115 C 372,165 322,210 256,210 Z" filter="url(#glow)"/>
  
  <!-- Bottom Ring -->
  <path fill="none" stroke="url(#bottomLoopGrad)" stroke-width="48" stroke-linecap="round" d="M 256,200 C 180,200 120,250 120,335 C 120,420 180,475 256,475 C 332,475 392,420 392,335 C 392,250 332,200 256,200 Z" filter="url(#glow)"/>

  <!-- Inner Interlocking Accents -->
  <circle cx="256" cy="115" r="45" fill="none" stroke="url(#topLoopGrad)" stroke-width="20" opacity="0.9"/>
  <circle cx="256" cy="335" r="70" fill="none" stroke="url(#bottomLoopGrad)" stroke-width="22" opacity="0.9"/>
</svg>
