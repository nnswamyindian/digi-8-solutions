name: Deploy to Ubuntu VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # Navigate to project directory (robustly checking common path variants)
            if [ -d "/var/www/digi8sloutions" ]; then
              cd /var/www/digi8sloutions
            elif [ -d "/var/www/digi8solutions" ]; then
              cd /var/www/digi8solutions
            elif [ -d "/var/www/digi8" ]; then
              cd /var/www/digi8
            else
              echo "Error: Directory not found in /var/www"
              exit 1
            fi
            
            # Pull latest changes
            git pull origin main
            
            # 1. Update Backend
            cd server
            npm install
            npm run build
            # Restart backend using PM2 (supports both process names: digi8-backend or digi8-api)
            pm2 restart digi8-backend || pm2 restart digi8-api || pm2 start dist/index.js --name digi8-backend
            pm2 save
            
            # 2. Update Frontend
            cd ..
            npm install
            npm run build
            
            # 3. Reload Nginx to flush cache & serve fresh bundle
            sudo systemctl reload nginx || true
